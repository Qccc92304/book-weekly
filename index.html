<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数据看板</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#fff;color:#1f2430;
 font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
 display:flex;align-items:center;justify-content:center;padding:40px 20px}
.gate{width:100%;max-width:360px;text-align:center}
.logo{width:40px;height:40px;border-radius:10px;background:#4b5563;color:#fff;
 font-size:17px;line-height:40px;margin:0 auto 18px}
h1{font-size:17px;font-weight:600;margin:0 0 6px}
p{font-size:12.5px;color:#8b909a;margin:0 0 22px}
input{width:100%;padding:11px 14px;font-size:14px;letter-spacing:1px;
 border:1px solid #dfe3e8;border-radius:9px;outline:none;text-align:center;
 font-family:inherit;text-transform:uppercase}
input:focus{border-color:#4b5563}
button{width:100%;margin-top:11px;padding:11px;font-size:14px;color:#fff;
 background:#4b5563;border:0;border-radius:9px;cursor:pointer;font-family:inherit}
button:hover{background:#3b4453}
.err{color:#c0392b;font-size:12.5px;margin-top:12px;min-height:18px}
.tip{font-size:11.5px;color:#b3b9c2;margin-top:26px;line-height:1.7}
#box{display:none}
#box .wrap{max-width:1180px;margin:0 auto;text-align:left}
.bar{position:fixed;top:0;left:0;right:0;height:38px;background:#fff;
 border-bottom:1px solid #eef0f3;display:flex;align-items:center;
 justify-content:flex-end;padding:0 16px;z-index:9}
.bar a{font-size:12px;color:#8b909a;cursor:pointer;text-decoration:none}
</style></head>
<body>
<div class="gate" id="gate">
  <div class="logo">数</div>
  <h1>合作数据看板</h1>
  <p>请输入渠道访问码</p>
  <input id="code" placeholder="访问码" autocomplete="off"
         onkeydown="if(event.key==='Enter')go()">
  <button onclick="go()">进入看板</button>
  <div class="err" id="err"></div>
  <div class="tip">访问码由对接人提供，如有疑问请联系您的商务对接人。</div>
</div>
<div id="box">
  <div class="bar"><a onclick="logout()">退出</a></div>
  <div class="wrap" id="wrap"></div>
</div>
<script>
var SALT = "568fd7d64a747858";
async function sha(s) {
  var b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(SALT + s));
  return Array.from(new Uint8Array(b)).map(function (x) {
    return x.toString(16).padStart(2, '0');
  }).join('').slice(0, 16);
}
function render(txt) {
  var d = new DOMParser().parseFromString(txt, 'text/html');
  document.getElementById('gate').style.display = 'none';
  /* 门户壳用的是 flex 居中布局，直接塞进去内容会被压成「窄版」。
     渲染目标页时还原成看板原本的 block 布局 + 内边距 */
  document.body.style.display = 'block';
  document.body.style.alignItems = '';
  document.body.style.justifyContent = '';
  document.body.style.minHeight = '';
  document.body.style.padding = '38px 20px 56px';
  var box = document.getElementById('box');
  box.style.display = 'block';
  box.style.width = '100%';
  var st = document.createElement('style');
  st.textContent = Array.from(d.querySelectorAll('style'))
    .map(function (s) { return s.textContent; }).join('\n');
  document.head.appendChild(st);
  document.getElementById('wrap').innerHTML = d.body.innerHTML;
  var t = d.querySelector('title');
  if (t) document.title = t.textContent;
  window.scrollTo(0, 0);
}
async function go(c, fromUrl) {
  c = (c || document.getElementById('code').value).trim();
  if (!c) return;
  var e = document.getElementById('err');
  if (e) e.textContent = '';
  var h = await sha(c);
  var r = await fetch('p/' + h + '.html');
  if (!r.ok) {
    if (e) e.textContent = '链接无效或已失效，请联系您的商务对接人';
    return;
  }
  /* 只有「手输」的码才长期记住；?c= 链接本身就是身份，不必写进 localStorage，
     否则点进某个渠道会把之前的总览身份覆盖掉 */
  if (!fromUrl) {
    try { localStorage.setItem('bc', c); } catch (x) {}
  }
  render(await r.text());
}
function logout() {
  try { localStorage.removeItem('bc'); } catch (x) {}
  location.href = location.pathname;
}
(function () {
  var q = new URLSearchParams(location.search).get('c');
  if (q) { go(q.toUpperCase(), true); return; }   /* 专属链接：点开直接进 */
  var c = null;
  try { c = localStorage.getItem('bc'); } catch (x) {}
  if (c) go(c);                              /* 裸链接：上次输过则自动进 */
})();
</script>
</body></html>
